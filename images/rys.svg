<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Основной мягкий градиент фона -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Градиент для светящейся точки фокуса -->
    <linearGradient id="dotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Скругленная плашка (Squircle) -->
  <rect width="128" height="128" rx="36" fill="url(#bgGradient)" />

  <!-- Минималистичные фильтрующие полосы (символизируют очистку ленты) -->
  <path d="M38 64 H90" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  <path d="M38 44 H76" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.95" />
  <path d="M38 84 H62" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.95" />

  <!-- Акцентная точка (символ режима фокусировки) -->
  <circle cx="82" cy="84" r="10" fill="url(#dotGradient)" />
</svg>